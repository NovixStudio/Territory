 };
 try{
  const [A,D,U]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-database.js'),import(B+'firebase-auth.js')]);
  const app=A.initializeApp(firebaseConfig),db=D.getDatabase(app),auth=U.getAuth(app);

 }catch(e){window.FB_ERR=e;console.warn('Firebase не загрузился:',e)}
